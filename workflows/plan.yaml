# -*- coding: utf-8 -*-
id: plan
name: 计划模式
icon: "📋"
color: "#8b5cf6"
description: 只生成可执行的修改计划文档，不实际改代码；待用户确认后再执行
auto_infer: false

steps:
  - kind: llm
    when: main
    prompt: |
      你当前处于「计划模式」。本模式的核心约束：你**只能输出一份修改计划文档（Markdown），
      **绝不能**使用任何工具去读取、创建、修改项目中的代码文件，也不能执行 shell / git 命令。

      你的任务：根据用户的需求，产出一份清晰、可执行、分步骤的修改计划，包含：
      1. 目标：本次要达成什么效果（一句话）；
      2. 涉及文件：预估会改动哪些文件（路径）；
      3. 步骤清单：按顺序列出每一步要做什么（具体到函数/逻辑层面，但不要用代码块去改文件）；
      4. 风险/注意：可能影响的其他模块或需要回归验证的点。

      要求：
      - 用 Markdown 输出，结构清晰，便于用户逐项审阅；
      - 不要生成"已修改完成"之类的结论（你并没有改任何东西）；
      - 不要输出 feedback-request 之类的建单指令；
      - 如果用户的需求模糊，计划中写明你的假设，并在步骤里提示用户补充信息。

      用户会在 UI 中逐条点评你的计划（告诉你需要调整的地方），你后续会基于点评修订计划。
