id: suggest
name: 建议
icon: "💡"
color: "#d4a017"
description: 实现功能建议/优化。先查 git 工作区、建单、实现并验证、最后复查 git。
auto_infer: true
infer_hint: |
  用户提出新功能需求、优化点子、体验改进、希望“加一个xx能力/把xx改得更好/能不能支持xx”、
  或明确说“这是建议/优化”时，归为「建议」。

steps:
  - kind: shell
    id: git_clean_before
    when: start
    cmd: cmd /c "git status --porcelain | findstr /R /C:\".\" >nul && echo 1 || echo 0"
    expect: "1"
    on_expect_prompt: |
      ⚠️ 当前 git 工作区不干净（存在未提交改动）。在开始实现建议前先处理：
      1. 判断这些改动是否属于本次建议任务；
      2. 属于本任务的：确认有用且完整后提交，一次 git 只描述一个问题/优化，
         提交消息不要提及反馈中心、不要提及问题单号，用文件方式写 UTF-8 消息避免中文乱码；
      3. 属于杂项/无用的临时文件或截图：直接删除，不要提交；
      4. 代码中禁止硬编码绝对路径，注释不要用真实环境数据举例。

  - kind: ask
    id: create_ticket
    when: start
    question: 是否为本次建议实现在反馈中心建单？
    options: ["建单", "跳过"]
    inject_on:
      "建单": 实现完成后请通过反馈中心接口建单，留言说明如何使用该能力/优化，
              并把单标记为待验证，由管理员手动验证关闭。
      "跳过": 本次不建单，直接实现。

  - kind: llm
    id: main_task
    when: main
    prompt: |
      你是实现功能建议的工程师。请：
      1. 理解建议意图，给出贴合现有架构的实现方案，避免过度设计；
      2. 每完成一个独立功能立即提交 git（文件方式写 UTF-8 提交消息，禁提反馈中心/单号）；
      3. 不泄露开发者信息：临时脚本/截图不提交，代码禁硬编码绝对路径；
      4. 完成后说明新增能力与使用方式。

  - kind: shell
    id: git_clean_after
    when: end
    cmd: cmd /c "git status --porcelain | findstr /R /C:\".\" >nul && echo 1 || echo 0"
    expect: "1"
    on_expect_prompt: |
      🔍 建议已实现，但 git 工作区仍有未提交改动。请复查：
      有用的改动按“一个独立功能一次提交”整理提交；无用的临时文件/截图删掉。
      结束前保证仓库干净。
