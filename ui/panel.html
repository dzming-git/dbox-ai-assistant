<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CodeBuddy</title>
<style>
  :root {
    --bg: #0f0f14;
    --panel: #17171f;
    --panel-2: #1f1f2a;
    --text: #e6e6ef;
    --muted: #9a9ab0;
    --accent: #6d8bff;
    --accent-2: #3a3a52;
    --user-bubble: #2a3550;
    --ai-bubble: #1f1f2a;
    --border: #2a2a38;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.6;
    display: flex; flex-direction: column; height: 100vh;
  }
  .chat-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .chat-header .title { font-weight: 600; }
  .chat-header .spacer { flex: 1; }
  .chat-header select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 13px;
  }
  .chat-header button {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px;
  }
  .chat-header button:hover { color: var(--text); border-color: var(--accent-2); }
  /* 会话切换条：下拉选会话 + 新建 + 删除，与标题栏分离避免窄屏拥挤 */
  .conv-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .conv-bar select {
    flex: 1; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 13px;
    min-width: 0;
  }
  .conv-bar button {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 9px; cursor: pointer; font-size: 13px; flex: 0 0 auto;
  }
  .conv-bar button:hover { color: var(--text); border-color: var(--accent-2); }
  .conv-bar button.danger:hover { color: var(--danger); border-color: var(--danger); }
  .messages {
    flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px;
  }
  .msg { display: flex; gap: 10px; max-width: 100%; min-width: 0; align-items: flex-start; }
  .msg .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .msg.assistant .avatar { background: var(--accent-2); color: var(--text); }
  /* 聊天软件风格：用户消息头像在右侧、气泡靠右；AI 在左侧 */
  .msg.user { flex-direction: row-reverse; }
  .msg.user .bubble { margin-left: auto; }
  .bubble {
    padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word;
    overflow-wrap: anywhere; min-width: 0;
    background: var(--ai-bubble); border: 1px solid var(--border); overflow-x: auto;
    max-width: min(88%, 720px);
  }
  .msg .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .msg.user .meta { text-align: right; }
  .msg.user .bubble-wrap { display: flex; flex-direction: column; align-items: flex-end; min-width: 0; }
  .msg.assistant .bubble-wrap {
    display: flex; flex-direction: column; align-items: flex-start; min-width: 0;
    /* 撑满剩余宽度：否则空气泡（仅“处理中”占位）会收缩到 min-width 而显得很窄，
       直到思考内容流入才“跳”宽。撑满后宽度从第一条思考出现前就是稳定的。 */
    flex: 1 1 auto;
  }
  .msg.user .bubble { background: var(--user-bubble); border-color: transparent; }
  .msg.assistant .bubble {
    background: var(--ai-bubble); min-width: 200px;
    /* 固定为可用宽度（仍受 max-width 约束），使思考出现前后宽度一致 */
    width: 100%;
  }
  /* 可折叠思考块：思考/回答可多段交替出现（思考1 → 回答1 → 思考2 → 回答2 …）。
     每段思考是独立区块，标题栏可点击折叠；该段思考结束后（下一段回答开始）自动收起，
     但绝不删除——全部回答结束后仍可点开回看完整思考过程。 */
  .think {
    margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px;
    background: rgba(255,255,255,.03); overflow: hidden;
  }
  .think-hd {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px; cursor: pointer;
    color: var(--muted); font-size: 12.5px; user-select: none;
  }
  .think-hd:hover { color: var(--text); }
  .think-hd .caret { font-size: 10px; width: 10px; text-align: center; }
  .think-body {
    padding: 0 10px 8px; color: var(--muted); font-style: italic; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
    max-height: 220px; overflow-y: auto;
  }
  .think.collapsed .think-body { display: none; }
  .bubble pre {
    background: #0c0c12; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; overflow-x: auto; margin: 8px 0;
  }
  .bubble code { background: #0c0c12; padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  .bubble pre code { background: none; padding: 0; }
  /* Markdown 渲染元素 */
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
    font-weight: 600; margin: 12px 0 6px; line-height: 1.3;
  }
  .bubble h1 { font-size: 18px; }
  .bubble h2 { font-size: 16px; }
  .bubble h3 { font-size: 14.5px; }
  .bubble h4 { font-size: 13.5px; }
  .bubble strong { font-weight: 700; color: var(--text); }
  .bubble em { font-style: italic; }
  .bubble blockquote {
    border-left: 3px solid var(--accent-2); margin: 6px 0; padding: 6px 12px;
    background: rgba(255,255,255,.02); border-radius: 0 6px 6px 0;
    color: var(--muted);
  }
  .bubble ul { margin: 6px 0; padding-left: 20px; }
  .bubble li { margin: 2px 0; line-height: 1.5; }
  .bubble li > ul { margin-top: 2px; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble a { color: var(--accent); text-decoration: underline; word-break: break-all; }
  .bubble p { margin: 4px 0; }
  .bubble table {
    border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px;
    overflow-x: auto; display: block;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--border); padding: 6px 10px; text-align: left;
    white-space: nowrap;
  }
  .bubble th { background: rgba(109,139,255,.1); font-weight: 600; }
  .bubble tr:nth-child(even) td { background: rgba(255,255,255,.02); }
  /* 长回答默认收起：超过 3 行折叠，仅显示约 3 行；点“展开全文”展开，收起后按钮锚定回原位置 */
  .collapsible.collapsed { overflow: hidden; position: relative; }
  .collapsible.collapsed::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 28px;
    background: linear-gradient(to bottom, rgba(31,31,42,0), var(--ai-bubble));
    pointer-events: none;
  }
  .expand-btn {
    display: block; width: 100%; text-align: center; color: var(--accent);
    font-size: 12.5px; cursor: pointer; user-select: none; padding: 6px 0 2px;
  }
  .expand-btn:hover { text-decoration: underline; }
  .empty { color: var(--muted); text-align: center; margin: auto; }
  .composer {
    border-top: 1px solid var(--border); background: var(--panel);
    padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end;
  }
  .composer textarea {
    flex: 1; resize: none; min-height: 24px; max-height: 160px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font: inherit; line-height: 1.5;
  }
  .composer textarea:focus { outline: none; border-color: var(--accent); }
  .composer button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 10px 16px; font: inherit; cursor: pointer; align-self: stretch;
  }
  .composer button:disabled { opacity: .5; cursor: default; }
  .composer .cancel { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  /* 处理中占位：明确告知用户 AI 正在工作，避免空气泡被误认为“服务挂了” */
  .pending { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; min-height: 18px; }
  .pending .spinner {
    width: 14px; height: 14px; flex: 0 0 auto;
    border: 2px solid var(--accent-2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-line { color: var(--muted); font-size: 12px; padding: 2px 14px 0; min-height: 16px; }
  /* 删除确认弹窗：内嵌面板实现，不依赖宿主原生 dialog（内嵌 webview 常禁用 confirm/alert） */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-mask.show { display: flex; }
  .modal { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; max-width: 320px; width: calc(100% - 40px); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .modal .modal-msg { margin: 0 0 16px; line-height: 1.6; }
  .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal button { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .modal button:hover { color: var(--text); border-color: var(--accent-2); }
  .modal button.danger { color: var(--danger); border-color: var(--danger); }
  .modal button.danger:hover { background: rgba(255,107,107,.12); color: var(--danger); }
  /* 移动端窄屏：小窗 + 屏宽本就窄，气泡需占更宽比例，否则几个字就换行 */
  @media (max-width: 480px) {
    .messages { padding: 12px 10px; gap: 10px; }
    .msg { gap: 6px; }
    .msg .avatar { width: 24px; height: 24px; font-size: 12px; border-radius: 6px; }
    .bubble {
      max-width: 94%;
      padding: 9px 10px;
      font-size: 13.5px;
      line-height: 1.55;
    }
    .msg.assistant .bubble { min-width: 85%; }
    .chat-header { padding: 8px 10px; }
    .conv-bar { padding: 6px 10px; }
  }
</style>
</head>
<body>
  <div class="chat-header">
    <span class="title">CodeBuddy</span>
    <span class="spacer"></span>
    <select id="model"></select>
    <button id="clearBtn" title="清空当前会话">清空</button>
  </div>
  <div class="conv-bar">
    <select id="convList" title="切换会话">
      <option value="">（无会话）</option>
    </select>
    <button id="newConvBtn" title="新建对话">＋</button>
    <button id="delConvBtn" class="danger" title="删除当前会话">🗑</button>
  </div>
  <div class="messages" id="messages">
    <div class="empty" id="empty">直接输入消息开始对话。可让它读写文件、运行命令。</div>
  </div>
  <div class="status-line" id="status"></div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="sendBtn">发送</button>
    <button id="cancelBtn" class="cancel" style="display:none">停止</button>
  </div>

<div class="modal-mask" id="confirmMask">
  <div class="modal">
    <p class="modal-msg" id="confirmMsg"></p>
    <div class="modal-actions">
      <button id="confirmCancel" type="button">取消</button>
      <button id="confirmOk" class="danger" type="button">删除</button>
    </div>
  </div>
</div>

<script>
let token = null;
let currentTask = null;     // 进行中的 task_id
// 服务端「生成中」的任务 id 集合。刷新页面后用它：① 渲染历史时跳过这些助手消息
// （避免与 SSE 回放内容重复，表现为文字错行/重复）② 重新订阅续传，避免回答丢失。
let runningTaskIds = new Set();
let runningTaskConv = {};   // task_id -> conversation_id
let currentConvId = null;    // 当前会话 id（持久化到 localStorage）

// 框架注入的真实地址占位符（routes.py 在返回面板时替换为运行期真实值）：
//   __EXT_KEY__        -> 拓展 key（=文件夹名），用于 token 握手 extId
//   __EXT_API_PREFIX__ -> 后端 API 前缀（/api/ext/<key>/，含结尾斜杠）
// 由此面板不再写死插件 id，可复用于任意拓展。
const EXT_KEY = '__EXT_KEY__';
const API_PREFIX = '__EXT_API_PREFIX__';
const CONV_KEY = 'codebuddy_conv_' + EXT_KEY;

// 宿主（ExtensionHost / ExtensionStandalone）通过 postMessage 下发 token
let booted = false;
function boot() {
  if (!getAuthToken()) return; // 无可用 token 不加载，避免 401 导致空（优先用 localStorage 实时 token）
  if (booted) return;          // 幂等：token 事件/兜底定时器/末尾 IIFE 可能多次触发，只初始化一次，避免历史被重复加载成多份
  booted = true;
  loadModels();
  // 顺序要求：先拿到「生成中」任务，再加载会话——渲染历史时才能跳过这些
  // 助手消息，改由 SSE 回放统一渲染；加载完再恢复订阅续传剩余内容。
  // 注：loadConversations → loadMessages 内部会调用 tryResumeForConv 恢复订阅，
  // 这里只需保证 running 列表先就绪即可。
  fetchRunningTasks().then(() => loadConversations());
}
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'DBOX_TOKEN' && e.data.token) {
    token = e.data.token;
    boot(); // token 到达后再加载，避免 401 导致空
  }
});
// 请求 token（宿主监听 DBOX_REQUEST_TOKEN 后回发 DBOX_TOKEN）
window.parent && window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: EXT_KEY }, '*');
// 兜底：若 token 延迟未到，重试一次请求；若已到则直接 boot（不会因 booted 标志被拦截）
setTimeout(() => {
  if (!token) window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: EXT_KEY }, '*');
  else boot();
}, 600);

// 取最新可用的 token：框架在父页用 refresh_token 静默刷新 JWT 后会写回
// localStorage['token']（见 webui src/api/client.ts 的 401 拦截器），父页 2s 轮询也会
// 触发刷新。面板只在挂载时经 postMessage 拿到过一次 token 并缓存进变量 token，
// 若不实时回读 localStorage，JWT 过期后面板会一直用旧 token 发请求 → 401 网络错误，
// 必须手动刷新页面才能恢复。这里优先读 localStorage，并兼容 sessionStorage 与注入 token。
function getAuthToken() {
  return localStorage.getItem('token')
    || localStorage.getItem('access_token')
    || sessionStorage.getItem('token')
    || token
    || '';
}

// 向父页重新索要 token（父页会经 postMessage 回发最新值）；兜底 500ms 后用现有值重试，
// 避免父页未响应时请求永久挂起。
function requestFreshToken() {
  return new Promise((resolve) => {
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      window.removeEventListener('message', onTok);
      resolve();
    };
    const onTok = (e) => {
      if (e.data && e.data.type === 'DBOX_TOKEN' && e.data.token) {
        token = e.data.token; // 同步到缓存变量；boot() 幂等不会重复初始化
        finish();
      }
    };
    window.addEventListener('message', onTok);
    window.parent && window.parent.postMessage({ type: 'DBOX_REQUEST_TOKEN', extId: EXT_KEY }, '*');
    setTimeout(finish, 500);
  });
}

async function api(p, o = {}) {
  o = o || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, o.headers || {});
  headers['Authorization'] = 'Bearer ' + getAuthToken();
  let r;
  try {
    r = await fetch(p, Object.assign({}, o, { headers }));
  } catch (netErr) {
    const err = new Error('网络错误：' + (netErr && netErr.message ? netErr.message : netErr));
    err.status = 0; throw err;
  }
  if (r.ok) return r;
  // 401：先让父页刷新并回发最新 token，再重试一次（避免陈旧 token 反复 401 导致“网络错误”）
  if (r.status === 401) {
    await requestFreshToken();
    const h2 = Object.assign({ 'Content-Type': 'application/json' }, o.headers || {});
    h2['Authorization'] = 'Bearer ' + getAuthToken();
    try { r = await fetch(p, Object.assign({}, o, { headers: h2 })); }
    catch (netErr) {
      const err = new Error('网络错误：' + (netErr && netErr.message ? netErr.message : netErr));
      err.status = 0; throw err;
    }
  }
  if (r.ok) return r;
  const txt = await r.text();
  let msg = txt;
  try { const j = JSON.parse(txt); if (j && j.message) msg = j.message; } catch (_) {}
  const err = new Error('HTTP ' + r.status + (msg ? '：' + msg : ''));
  err.status = r.status; throw err;
}
function setStatus(msg, isErr) {
  const el = document.getElementById('status');
  if (!el) return;
  el.textContent = msg || '';
  el.style.color = isErr ? 'var(--danger)' : '';
}
// 内嵌确认弹窗：返回 Promise<boolean>。用面板内 DOM 实现，避免依赖宿主原生 confirm
// （内嵌 webview 常禁用原生 dialog，导致点击删除“无响应”）。
function showConfirm(msg) {
  return new Promise((resolve) => {
    const mask = document.getElementById('confirmMask');
    const msgEl = document.getElementById('confirmMsg');
    const okBtn = document.getElementById('confirmOk');
    const cancelBtn = document.getElementById('confirmCancel');
    if (!mask || !msgEl || !okBtn || !cancelBtn) { resolve(true); return; }
    msgEl.textContent = msg;
    let settled = false;
    function cleanup() {
      if (settled) return; settled = true;
      mask.classList.remove('show');
      okBtn.onclick = null; cancelBtn.onclick = null; mask.onclick = null;
    }
    okBtn.onclick = () => { cleanup(); resolve(true); };
    cancelBtn.onclick = () => { cleanup(); resolve(false); };
    mask.onclick = (e) => { if (e.target === mask) { cleanup(); resolve(false); } };
    mask.classList.add('show');
  });
}
function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const p = n => (n < 10 ? '0' + n : '' + n);
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
// Markdown 渲染：标题 / 加粗 / 斜体 / 行内代码 / 代码块 / 列表 / 引用块 / 链接 / 分割线
function renderMarkdown(text) {
  if (!text) return '';
  // 先处理围栏代码块（```），避免内部内容被其他规则误转义
  let html = esc(text);
  html = html.replace(/```([\s\S]*?)```/g, (m, code) => '\x00PRE' + code.replace(/^\n/, '') + '\x00END\x00');
  // 标题
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // 加粗与斜体（先匹配加粗，避免 **foo**bar** 被拆成 *foo*bar*）
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // 行内代码（排除已替换的代码块占位符）
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // 链接 [text](url)
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 表格：| col | col | + 分隔行 + 数据行 → <table>
  // 先识别连续的表格行块（以 | 开头/结尾的行），整体替换
  html = html.replace(
    /((?:^\|.+\|\n?)+)/gm,
    function (block) {
      var lines = block.trim().split('\n');
      if (lines.length < 2) return block; // 至少需要表头+分隔
      // 检查第二行是否为分隔行（含 -）
      var isSep = /^\|?\s*[:\-]+\s*\|/.test(lines[1] || '');
      if (!isSep) return block;
      var hCells = lines[0].split('|').filter(function(c){return c.trim();});
      var thead = '<tr>' + hCells.map(function(c){return '<th>' + c.trim() + '</th>';}).join('') + '</tr>';
      var bodyRows = [];
      for (var i = 2; i < lines.length; i++) {
        var cells = lines[i].split('|').filter(function(c){return c.trim();});
        bodyRows.push('<tr>' + cells.map(function(c){return '<td>' + c.trim() + '</td>';}).join('') + '</tr>');
      }
      return '<table><thead>' + thead + '</thead><tbody>' + bodyRows.join('') + '</tbody></table>';
    }
  );
  // 分割线
  html = html.replace(/^---+$/gm, '<hr>');
  // 引用块 > （支持多行连续引用）
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  // 无序列表 - item 或 * item
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  // 有序列表 1. item
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // 连续 <li> 包裹为 <ul>
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  // 段落：双换行或首行空白后跟非列表/非标题行 → 包 <p>
  html = html.replace(/\n\n(?![<\n])/g, '\n<p>').replace(/\n(<p>)/g, '$1');
  // 还原代码块
  html = html.replace(/\x00PRE([\s\S]*?)\x00END\x00/g, (m, c) => '<pre><code>' + c + '</code></pre>');
  return html;
}

function addMsg(role, text, ts) {

function scrollBottom() {

}

// 长回答折叠：超过 3 行时默认收起，仅显示 3 行，点击“展开全文”再展开
const COLLAPSE_LINES = 3; // 内容超过该行文时折叠
function lineHeightOf(el) {
  const lh = parseFloat(getComputedStyle(el).lineHeight);
  return isNaN(lh) ? 22 : lh;
}
// 对气泡内「每一个」回答片段分别做长文折叠（思考/回答多段交替时会有多个 .body）。
function applyCollapse(bubble) {
  if (!bubble) return;
  let bodies = Array.from(bubble.querySelectorAll('.body'));
  // 兼容历史对话：内容直接写在 bubble 内（无 .body、无思考段）时，统一包进一个 .body。
  // 必须用 childNodes（含文本节点），不能用 children——纯长文本是文本节点，
  // children.length 为 0 会导致漏折叠。
  if (!bodies.length && !bubble.querySelector('.think') && !bubble.querySelector('.expand-btn')
      && bubble.childNodes.length) {
    const w = document.createElement('div');
    w.className = 'body';
    while (bubble.firstChild) w.appendChild(bubble.firstChild);
    bubble.appendChild(w);
    bodies = [w];
  }
  bodies.forEach(b => collapseBody(b, bubble));
}
// 单个回答片段的折叠：超过 N 行默认收起，按钮紧跟该片段（多段各自独立展开/收起）
function collapseBody(bodyEl, bubble) {
  // 已折叠则跳过，避免重复添加“展开全文”按钮（面板显隐切换 / 历史重渲染会多次调用）
  if (bodyEl.classList.contains('collapsible')) return;
  const lh = lineHeightOf(bodyEl);
  if (bodyEl.scrollHeight <= lh * COLLAPSE_LINES) return;
  bodyEl.classList.add('collapsible', 'collapsed');
  bodyEl.style.maxHeight = (lh * COLLAPSE_LINES) + 'px';
  const btn = document.createElement('span');
  btn.className = 'expand-btn';
  btn.textContent = '展开全文 ▾';
  btn.onclick = () => toggleCollapse(bodyEl, btn, bubble);
  // 按钮紧跟在被折叠的片段之后（与折叠内容平级，不被 overflow 裁剪）
  bodyEl.insertAdjacentElement('afterend', btn);
}
// 展开/收起时，用按钮前后屏幕位置差修正滚动，把按钮钉在原视觉位置，避免阅读位置跳动
function toggleCollapse(bodyEl, btn, bubble) {
  const m = document.getElementById('messages');
  const before = btn.getBoundingClientRect().top;
  if (bodyEl.classList.contains('collapsed')) {
    bodyEl.style.maxHeight = 'none';
    bodyEl.classList.remove('collapsed');
    btn.textContent = '收起 ▴';
  } else {
    bodyEl.style.maxHeight = (lineHeightOf(bodyEl) * COLLAPSE_LINES) + 'px';
    bodyEl.classList.add('collapsed');
    btn.textContent = '展开全文 ▾';
  }
  const after = btn.getBoundingClientRect().top;
  m.scrollTop += (after - before);
}

// 构建一条助手消息容器：思考与回答按「多段交替」渲染（思考1 → 回答1 → 思考2 → 回答2 …）。
// 每当思考/回答类型切换就新开一个独立片段（思考 → 回答后再思考，会新开辟第二个思考区）；
// 思考片段在其后的回答开始时自动收起，但绝不删除——全部回答结束后仍可点标题回看完整思考过程。
// 返回流式渲染所需的引用与方法，send() 与 resumeRunningTask() 共用，避免重复实现。
function newAssistantBubble() {
  const empty = document.getElementById('empty'); if (empty) empty.remove();
  const wrap = document.createElement('div'); wrap.className = 'msg assistant';
  const av = document.createElement('div'); av.className = 'avatar'; av.textContent = 'AI';
  const bubbleWrap = document.createElement('div'); bubbleWrap.className = 'bubble-wrap';
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  bubbleWrap.appendChild(bubble); wrap.appendChild(av); wrap.appendChild(bubbleWrap);
  document.getElementById('messages').appendChild(wrap); scrollBottom();

  // 处理中占位：始终留在气泡末尾，新片段插在它之前，保证时间顺序正确
  const pendingEl = document.createElement('div'); pendingEl.className = 'pending';
  pendingEl.innerHTML = '<span class="spinner"></span> AI 正在思考…';
  bubble.appendChild(pendingEl);

  const state = { segs: [], cur: null, pendingCleared: false };

  function clearPending() {
    if (state.pendingCleared) return; state.pendingCleared = true;
    if (pendingEl.parentNode) pendingEl.remove();
  }

  // 新建片段：type = 'think' | 'answer'
  function newSeg(type) {
    const seg = { type, buf: '', done: false, userToggled: false, finalized: false };
    if (type === 'think') {
      const w = document.createElement('div'); w.className = 'think';
      const hd = document.createElement('div'); hd.className = 'think-hd';
      hd.innerHTML = '<span class="caret">▾</span><span class="label">💭 思考中…</span>';
      const bd = document.createElement('div'); bd.className = 'think-body';
      w.appendChild(hd); w.appendChild(bd);
      // 点击标题折叠/展开；手动操作过的片段，后续自动收起不再覆盖
      hd.addEventListener('click', () => {
        if (!seg.buf.trim()) return;
        seg.userToggled = true;
        const isC = w.classList.toggle('collapsed');
        const caret = hd.querySelector('.caret'); if (caret) caret.textContent = isC ? '▸' : '▾';
      });
      seg.el = w; seg.bodyEl = bd; seg.hd = hd;
    } else {
      const bd = document.createElement('div'); bd.className = 'body';
      seg.el = bd; seg.bodyEl = bd;
    }
    // 占位仍在气泡内时插到它之前（保持时间顺序）；占位已被 clearPending 移除则直接追加
    if (pendingEl.parentNode === bubble) bubble.insertBefore(seg.el, pendingEl);
    else bubble.appendChild(seg.el);
    state.segs.push(seg);
    state.cur = seg;
    return seg;
  }

  // 收尾所有未结束的思考段：标题改「思考过程」并默认收起（保留、可点开回看，不删除）；
  // 用户手动操作过的段保持其选择。
  function closePrevThink() {
    state.segs.forEach(s => {
      if (s.type !== 'think' || s.done) return;
      s.done = true;
      const label = s.hd && s.hd.querySelector('.label');
      if (label) label.textContent = '💭 思考过程';
      if (!s.userToggled) {
        s.el.classList.add('collapsed');
        const caret = s.hd && s.hd.querySelector('.caret');
        if (caret) caret.textContent = '▸';
      }
    });
  }

  // 保证当前片段是指定类型；类型切换时先收尾思考段再新开一段
  function ensureSeg(type) {
    if (state.cur && state.cur.type === type) return state.cur;
    closePrevThink();
    return newSeg(type);
  }

  // 节流渲染：每个片段只在下一帧渲染一次（合并同一帧内的多次 token 追加），
  // 避免每条 token 都全量 innerHTML 重渲染导致的 O(n^2) 主线程卡死（长回答时
  // 浏览器点击无响应）。finalized 的片段不再被延迟渲染覆盖。
  function scheduleRender(seg) {
    if (seg.finalized || seg._renderPending) return;
    seg._renderPending = true;
    const s = seg;
    requestAnimationFrame(function () {
      s._renderPending = false;
      if (s.finalized) return;
      s.bodyEl.innerHTML = renderMarkdown(s.buf);
      scrollBottom();
    });
  }
  function appendThinking(chunk) {
    clearPending();
    const seg = ensureSeg('think');
    seg.buf += chunk;
    scheduleRender(seg);
  }
  function appendAnswer(chunk) {
    clearPending();
    const seg = ensureSeg('answer');
    seg.buf += chunk;
    scheduleRender(seg);
  }
  function setAnswer(full) {
    clearPending();
    const seg = ensureSeg('answer');
    seg.buf = full;
    seg.finalized = true;
    seg._renderPending = false;
    seg.bodyEl.innerHTML = renderMarkdown(full);
    scrollBottom();
  }
  // 完成时收尾：兜底空回复、思考段保留（默认收起可回看）、长回答折叠
  function finalize() {
    clearPending();
    // 锁定所有片段，避免遗留的节流渲染帧覆盖已收尾的折叠态
    state.segs.forEach(function (s) { s.finalized = true; });
    closePrevThink();     // 思考段不会被删除，只是默认收起
    const hasAnswer = state.segs.some(s => s.type === 'answer' && s.buf.trim());
    if (!hasAnswer) {
      const seg = ensureSeg('answer');
      seg.bodyEl.innerHTML = '<span style="color:var(--muted)">（没有收到回复）</span>';
    }
    bubble.dataset.done = '1';   // 标记已完成，允许在面板可见时补折叠
    applyCollapse(bubble);
  }

  // 错误提示等直接写入回答区；bodyEl 用 getter 惰性保证存在回答段
  return {
    bubble, clearPending, appendThinking, appendAnswer, setAnswer, finalize,
    get bodyEl() { return ensureSeg('answer').bodyEl; }
  };
}

// ---------- 会话管理 ----------
function saveCurrentConv() {
  try { localStorage.setItem(CONV_KEY, currentConvId || ''); } catch (_) {}
}
function loadCurrentConv() {
  try { return localStorage.getItem(CONV_KEY) || ''; } catch (_) { return ''; }
}
async function loadConversations() {
  try {
    const r = await api(API_PREFIX + 'conversations'); const j = await r.json();
    const list = j.conversations || [];
    const sel = document.getElementById('convList');
    const prev = currentConvId;
    sel.innerHTML = '';
    if (!list.length) {
      const o = document.createElement('option'); o.value = ''; o.textContent = '（无会话）';
      sel.appendChild(o);
      currentConvId = null; saveCurrentConv();
      renderMessages([]);
      return;
    }
    list.forEach(c => {
      const o = document.createElement('option'); o.value = c.id;
      const title = (c.title || '新对话').replace(/</g, '&lt;');
      const prev = c.preview ? ' — ' + c.preview.replace(/</g, '&lt;') : '';
      o.textContent = title + prev;
      sel.appendChild(o);
    });
    // 恢复上次会话 id；不存在则取最近（第一项）
    let target = (prev && list.some(c => c.id === prev)) ? prev : list[0].id;
    sel.value = target;
    if (target !== currentConvId) {
      currentConvId = target; saveCurrentConv();
    }
    await loadMessages(target);
  } catch (e) {
    setStatus('加载会话失败：' + (e.message || e), true);
  }
}
async function selectConversation(cid) {
  if (cid === currentConvId) return;
  currentConvId = cid || null; saveCurrentConv();
  await loadMessages(cid);
}
async function loadMessages(cid) {
  if (!cid) { renderMessages([]); return; }
  try {
    const r = await api(API_PREFIX + 'conversations/' + encodeURIComponent(cid) + '/messages');
    const j = await r.json();
    renderMessages(j.messages || []);
    tryResumeForConv(cid);   // 该会话若有生成中的任务则恢复订阅，避免内容被跳过又收不到
    scrollBottom();
  } catch (e) {
    setStatus('加载消息失败：' + (e.message || e), true);
  }
}
function renderMessages(msgs) {
  const box = document.getElementById('messages');
  box.innerHTML = '<div class="empty" id="empty">直接输入消息开始对话。可让它读写文件、运行命令。</div>';
  (msgs || []).forEach(turn => {
    // 仅当该助手消息所属任务既在「生成中」、又属于当前会话时才跳过：
    // 这种情况下启动流程会恢复订阅，后端回放已生成内容，由流式路径统一渲染，
    // 避免同一段内容出现两份（历史一份 + 回放一份）造成错行/重复。
    // 若任务属于别的会话（不会恢复订阅、也没有回放），则必须正常渲染，
    // 否则这段内容会永久看不到。
    if (turn.role === 'assistant' && turn.task_id
        && runningTaskIds.has(turn.task_id)
        && runningTaskConv[turn.task_id] === currentConvId) return;
    const { bubble } = addMsg(turn.role, turn.text, turn.created_at);
    if (turn.role === 'assistant') {
      // 历史助手消息也用 .body 包裹，与流式路径一致，确保 applyCollapse 能找到容器并折叠
      const bodyEl = document.createElement('div');
      bodyEl.className = 'body';
      bodyEl.innerHTML = renderMarkdown(turn.text);
      bubble.appendChild(bodyEl);
      bubble.dataset.done = '1';   // 历史消息视为已完成，允许在面板可见时补折叠
      applyCollapse(bubble);
    } else {
      bubble.innerHTML = renderMarkdown(turn.text);
    }
  });
}
async function newConversation() {
  try {
    const r = await api(API_PREFIX + 'conversations', { method: 'POST', body: JSON.stringify({}) });
    const j = await r.json();
    if (!j.success) { setStatus('新建会话失败：' + (j.message || ''), true); return; }
    await loadConversations();
    currentConvId = j.conversation_id; saveCurrentConv();
    const sel = document.getElementById('convList'); sel.value = j.conversation_id;
    renderMessages([]);
  } catch (e) {
    setStatus('新建会话失败：' + (e.message || e), true);
  }
}
async function deleteConversation() {
  if (!currentConvId) { setStatus('没有可删除的会话', true); return; }
  if (!(await showConfirm('删除当前会话及其全部消息？'))) return;
  try {
    const r = await api(API_PREFIX + 'conversations/' + encodeURIComponent(currentConvId), { method: 'DELETE' });
    const j = await r.json();
    if (!j.success) { setStatus('删除失败：' + (j.message || ''), true); return; }
    currentConvId = null; saveCurrentConv();
    await loadConversations();
  } catch (e) {
    setStatus('删除失败：' + (e.message || e), true);
  }
}

// ---------- 发送 ----------
async function send() {
  const ta = document.getElementById('input');
  const text = ta.value.trim();
  if (!text || currentTask) return;
  ta.value = ''; ta.style.height = 'auto';
  const { bubble } = addMsg('user', text); bubble.innerHTML = renderMarkdown(text);

  const ab = newAssistantBubble();

  try {
    const r = await api(API_PREFIX + 'chat', { method: 'POST',
      body: JSON.stringify({ message: text, model: document.getElementById('model').value,
        conversation_id: currentConvId || '' }) });
    const j = await r.json();
    if (!j.success) { ab.clearPending(); ab.bodyEl.innerHTML = '<span style="color:var(--danger)">发送失败：' + esc(j.message || '') + '</span>'; setStatus('发送失败：' + (j.message || ''), true); return; }
    currentTask = j.task_id;
    // 若服务端新建/命中了某个会话（首条消息自动建会话），同步到当前会话并持久化
    if (j.conversation_id && j.conversation_id !== currentConvId) {
      currentConvId = j.conversation_id; saveCurrentConv();
      const sel = document.getElementById('convList'); if (sel) sel.value = currentConvId;
    }
    setRunning(true);
  } catch (e) {
    ab.clearPending();
    ab.bodyEl.innerHTML = '<span style="color:var(--danger)">发送失败：' + esc(e.message || '') + '</span>';
    setStatus('发送请求失败：' + (e.message || e) + '（请确认已登录且扩展宿主 8093 运行中）', true);
    return;
  }

  // SSE：EventSource 无法携带 Authorization header，故把 token 放进 query 参数
  // （浏览器侧唯一可行的带凭证方式；后端 /stream 已支持 ?token=）。
  const es = new EventSource(API_PREFIX + 'stream?task_id=' + encodeURIComponent(currentTask)
    + '&token=' + encodeURIComponent(getAuthToken()));
  es.addEventListener('token', (e) => {
    ab.appendAnswer(e.data);
  });
  es.addEventListener('thinking', (e) => {
    ab.appendThinking(e.data);
  });
  es.addEventListener('assistant', (e) => {
    ab.setAnswer(e.data);
  });
  es.addEventListener('error', (e) => {
    ab.clearPending();
    ab.bodyEl.innerHTML += '<div style="color:var(--danger)">错误：' + esc(e.data) + '</div>';
  });
  // SSE 连接层中断（非业务 error 事件）：给出明确提示，避免占位永久旋转
  es.onerror = () => {
    ab.clearPending();
    ab.bodyEl.innerHTML += '<div style="color:var(--danger)">连接中断，请重试</div>';
    setRunning(false); currentTask = null;
  };
  es.addEventListener('done', () => {
    es.close();
    ab.finalize();        // 兜底空回复 + 收起思考 + 长回答折叠
    currentTask = null; setRunning(false);
    document.getElementById('status').textContent = '';
    // 会话标题/preview 可能已更新，刷新会话列表（不重渲染当前消息）
    loadConversations();
  });
}
// ---------- 刷新后恢复「生成中」的任务 ----------
// 原先刷新页面后 currentTask 丢失、SSE 不重连，正在生成的回答收不到，已落盘的
// 部分还可能与本地残留叠加显示两份（文字错行/重复）。这里在启动时查询服务端
// 仍在生成的任务并重新订阅：后端会回放已生成的全部内容，再续传剩余部分。
async function fetchRunningTasks() {
  try {
    const r = await api(API_PREFIX + 'tasks');
    const j = await r.json();
    const running = j.running || [];
    runningTaskIds = new Set(running.map(t => t.id));
    runningTaskConv = {};
    running.forEach(t => { runningTaskConv[t.id] = t.conversation_id; });
    return running;
  } catch (e) {
    runningTaskIds = new Set();
    runningTaskConv = {};
    return [];
  }
}

function resumeRunningTask(taskId) {
  if (currentTask) return;   // 已有进行中的订阅则不重复
  currentTask = taskId;
  const ab = newAssistantBubble();
  setRunning(true);
  const es = new EventSource(API_PREFIX + 'stream?task_id=' + encodeURIComponent(taskId)
    + '&token=' + encodeURIComponent(getAuthToken()));
  es.addEventListener('token', (e) => {
    ab.appendAnswer(e.data);
  });
  es.addEventListener('thinking', (e) => {
    ab.appendThinking(e.data);
  });
  es.addEventListener('assistant', (e) => {
    ab.setAnswer(e.data);
  });
  es.addEventListener('error', (e) => {
    ab.clearPending();
    ab.bodyEl.innerHTML += '<div style="color:var(--danger)">错误：' + esc(e.data) + '</div>';
  });
  es.onerror = () => {
    ab.clearPending();
    ab.bodyEl.innerHTML += '<div style="color:var(--danger)">连接中断，请重试</div>';
    setRunning(false); currentTask = null;
  };
  es.addEventListener('done', () => {
    es.close();
    ab.finalize();        // 兜底空回复 + 收起思考 + 长回答折叠
    currentTask = null; setRunning(false);
    document.getElementById('status').textContent = '';
    loadConversations();
  });
  scrollBottom();
}

// 某个会话里若存在「生成中」的任务，则恢复订阅续传（渲染历史时会跳过它的
// 助手消息，必须在这里补上订阅，否则那段内容会既不显示也收不到）。
function tryResumeForConv(cid) {
  if (!cid) return;
  for (const tid of runningTaskIds) {
    if (runningTaskConv[tid] === cid) { resumeRunningTask(tid); break; }
  }
}

function setRunning(run) {
  document.getElementById('sendBtn').disabled = run;
  document.getElementById('cancelBtn').style.display = run ? '' : 'none';
  document.getElementById('status').textContent = run ? '助手正在思考…' : '';
}
async function cancel() {
  if (!currentTask) return;
  await api(API_PREFIX + 'cancel', { method: 'POST', body: JSON.stringify({ task_id: currentTask }) });
}

// ---------- 历史 / 模型 ----------
async function loadModels() {
  try {
    const r = await api(API_PREFIX + 'models'); const j = await r.json();
    const sel = document.getElementById('model');
    (j.models || []).forEach(m => {
      const o = document.createElement('option'); o.value = m.id; o.textContent = m.name; sel.appendChild(o);
    });
    if (!sel.options.length) { const o = document.createElement('option'); o.value = ''; o.textContent = '默认模型'; sel.appendChild(o); }
    if (j.models && !j.models.length) setStatus('未获取到模型，请检查 CodeBuddy后端配置', true);
  } catch (e) {
    setStatus('加载模型失败：' + (e.message || e) + '（请确认已登录且扩展宿主 8093 运行中）', true);
  }
}

// ---------- 绑定 ----------
document.getElementById('sendBtn').onclick = send;
document.getElementById('cancelBtn').onclick = cancel;
document.getElementById('clearBtn').onclick = async () => {
  await api(API_PREFIX + 'clear', { method: 'POST', body: JSON.stringify({ conversation_id: currentConvId || '' }) });
  renderMessages([]);
};
document.getElementById('newConvBtn').onclick = newConversation;
document.getElementById('delConvBtn').onclick = deleteConversation;
document.getElementById('convList').onchange = (e) => selectConversation(e.target.value);
const ta = document.getElementById('input');
ta.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; });

// ---------- 显隐时保持阅读位置 / 补折叠 ----------
// 面板在小窗 / 全屏 / 收起间切换时，iframe 常驻但可能被 display:none 隐藏：隐藏态下元素
// 没有布局宽度，scrollHeight 测出 0，会导致①长回答“折叠”误判为短（不折叠、无收起按钮）
// ②scrollBottom 无法滚动（停留在最顶部）。用 IntersectionObserver 监听面板是否可见，
// 可见时统一补折叠（长回答默认收起，带“展开全文”按钮）并恢复到正确滚动位置。
let _wasAtBottom = true;
let _savedScrollTop = 0;
function _trackScroll() {
  const m = document.getElementById('messages'); if (!m) return;
  _wasAtBottom = (m.scrollTop + m.clientHeight >= m.scrollHeight - 4);
}
function _onPanelVisible() {
  // 仅对已完成的消息补折叠，避免把“进行中”的流式回答误收起
  document.querySelectorAll('.msg.assistant .bubble[data-done]').forEach(applyCollapse);
  const m = document.getElementById('messages'); if (!m) return;
  // 隐藏前停在底部（或首次打开）→ 滚到最新；否则恢复到隐藏前的阅读位置
  if (_wasAtBottom) m.scrollTop = m.scrollHeight; else m.scrollTop = _savedScrollTop;
}
function _onPanelHidden() {
  const m = document.getElementById('messages'); if (m) _savedScrollTop = m.scrollTop;
}
(function setupVisibility() {
  const m = document.getElementById('messages'); if (m) m.addEventListener('scroll', _trackScroll);
  if (!('IntersectionObserver' in window)) { _onPanelVisible(); return; }
  const io = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (en.isIntersecting) _onPanelVisible(); else _onPanelHidden();
    }
  }, { threshold: 0 });
  io.observe(document.body);
})();

// 跨窗口：若其他窗口已发送/恢复，本窗口不做强制同步（保持各自视图）。

(async () => {
  // 优先等待宿主经 postMessage 下发 token（见顶部监听器），超时后兜底尝试加载
  await new Promise(res => setTimeout(res, 600));
  boot();
})();
